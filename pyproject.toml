[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarprompt-ai"
version = "1.0.0"
description = "A Streamlit app for academic prompts with Supabase integration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.58.0",
    "supabase>=2.30.1",
    "streamlit-cookies-controller>=0.0.4",
    "python-dotenv>=1.2.2"
]

[tool.setuptools.packages.find]
where = ["src"]